name: Feature request
description: Suggest an improvement for a future ESTOFEX release.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What would you like to see added or improved?
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: How would this help in Home Assistant?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Forecast map
        - Local warning detection
        - Translations or summaries
        - Diagnostics
        - Dashboard or Lovelace
        - Other
    validations:
      required: true
