name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Run tests
        run: pytest

  home-assistant:
    name: Home Assistant integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Home Assistant test dependencies
        run: python -m pip install -r requirements-test-ha.txt
      - name: Run real Home Assistant tests separately from stub tests
        run: python -m pytest -c tests_ha/pytest.ini tests_ha
